<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#0A63C4"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B5B"/>
      <stop offset="1" stop-color="#D8241A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bg)"/>

  <!-- download arrow pointing down -->
  <path d="M78 40 H102 V78 H120 L90 110 L60 78 H78 Z" fill="url(#arrow)"/>

  <!-- tray -->
  <path d="M46 118 v16 a16 16 0 0 0 16 16 h56 a16 16 0 0 0 16 -16 v-16"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- purge slash -->
  <line x1="44" y1="140" x2="138" y2="44" stroke="#0A63C4" stroke-width="19"
        stroke-linecap="round" opacity="0.32"/>
  <line x1="44" y1="140" x2="138" y2="44" stroke="url(#slash)" stroke-width="12"
        stroke-linecap="round"/>
</svg>
